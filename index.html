<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 AI 數學小天才 - 算式篇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Comic Sans MS', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 10px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            padding: 12px;
            color: white;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.8em;
        }

        /* Progress */
        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            border-radius: 10px;
            transition: width 0.3s;
        }

        /* Question */
        .question-box {
            background: linear-gradient(135deg, #e8f4fd 0%, #d4e8f7 100%);
            border: 3px solid #667eea;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
            font-size: 1.2em;
            color: #333;
            line-height: 1.6;
        }

        /* Drag Elements */
        .elements-area {
            background: #f8f9fa;
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
        }

        .elements-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .elements-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 60px;
            padding: 10px;
            background: white;
            border-radius: 12px;
        }

        .drag-element {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .drag-element:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .drag-element.number {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }

        .drag-element.operator {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
        }

        .drag-element.parenthesis {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
        }

        .drag-element.distractor {
            background: linear-gradient(135deg, #9e9e9e 0%, #757575 100%);
            opacity: 0.7;
        }

        .drag-element.used {
            opacity: 0.3;
            pointer-events: none;
        }

        /* Expression Workspace */
        .workspace-area {
            background: #fffde7;
            border: 3px solid #ffc107;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            min-height: 120px;
        }

        .workspace-label {
            font-size: 0.85em;
            color: #ff8f00;
            margin-bottom: 10px;
        }

        .workspace {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            padding: 15px;
            background: white;
            border-radius: 12px;
        }

        .workspace-slot {
            width: 50px;
            height: 50px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }

        .workspace-element {
            padding: 10px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .workspace-element .remove-btn {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 0.8em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .workspace-element .remove-btn:hover {
            background: rgba(255,255,255,0.5);
        }

        /* Buttons */
        .btn-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #607D8B 0%, #546E7A 100%);
            color: white;
        }

        /* Hint Area */
        .hint-area {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border: 2px solid #2196F3;
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            display: none;
        }

        .hint-area.show {
            display: block;
        }

        .hint-title {
            color: #1976D2;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hint-content {
            color: #333;
            line-height: 1.6;
            font-size: 0.95em;
        }

        /* Start Screen */
        #startScreen {
            padding: 30px;
        }

        #gameScreen {
            display: none;
        }

        /* Result Animation */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .result-overlay.show {
            display: flex;
        }

        .result-box {
            background: white;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-emoji {
            font-size: 4em;
            margin: 10px 0;
        }

        .result-score {
            font-size: 3em;
            color: #667eea;
            font-weight: bold;
        }

        /* Drop Zone Highlight */
        .workspace.drag-over {
            background: #fff9c4;
            border-color: #ffc107;
        }

        /* Instructions */
        .instructions {
            background: #fff3e0;
            border: 2px solid #ff9800;
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            font-size: 0.9em;
            color: #e65100;
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 1.6em;
            }
            
            .stats {
                padding: 10px;
            }
            
            .stat-value {
                font-size: 1.2em;
            }
            
            .question-box {
                font-size: 1em;
                padding: 15px;
            }
            
            .drag-element {
                padding: 10px 15px;
                font-size: 1.1em;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }

        /* Prevent text selection */
        .drag-element, .workspace-element, .btn {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Prevent scrolling while dragging on mobile */
        .elements-container, .workspace {
            touch-action: none;
        }

        /* Mobile touch feedback */
        .drag-element:active, .workspace-element:active {
            transform: scale(0.95);
        }

        .drag-element.used {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(50%);
        }

        /* Workspace drop zone highlight */
        .workspace.drag-over {
            background: #fff9c4;
            border-color: #ffc107;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.5);
        }

        /* Touch drag visual */
        .touch-dragging {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.9;
            transform: scale(1.15);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen">
            <h1>🎮 AI 數學小天才</h1>
            <p class="subtitle">拖曳數字同運算符號，組成正確既算式！</p>
            
            <div class="instructions">
                📖 <strong>玩法說明：</strong><br>
                1. 仔細閱讀題目<br>
                2. 拖曳或點擊正確的數字與運算符號<br>
                3. 組成算式後按「✅ 確認」<br>
                4. 如有需要可按「💡 提示」
            </div>
            
            <button class="btn btn-primary" id="startBtn" style="font-size: 1.2em; padding: 15px 40px;">
                🚀 開始挑戰
            </button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen">
            <h1>🎮 數學大冒險</h1>
            <p class="subtitle">組成正確既算式！</p>

            <!-- Stats -->
            <div class="stats">
                <div>
                    <div class="stat-value" id="score">0</div>
                    <div class="stat-label">分數</div>
                </div>
                <div>
                    <div class="stat-value" id="questionNum">1/10</div>
                    <div class="stat-label">題目</div>
                </div>
                <div>
                    <div class="stat-value" id="streak">0</div>
                    <div class="stat-label">連勝</div>
                </div>
            </div>

            <!-- Progress -->
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <!-- Question -->
            <div class="question-box" id="question">
                準備好未？
            </div>

            <!-- Elements to Drag -->
            <div class="elements-area">
                <div class="elements-label">📦 拖曳以下元素去組成算式：</div>
                <div class="elements-container" id="elementsContainer">
                    <!-- Elements will be generated here -->
                </div>
            </div>

            <!-- Workspace -->
            <div class="workspace-area">
                <div class="workspace-label">🔧 工作區（拖曳或點擊元素落去）：</div>
                <div class="workspace" id="workspace" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                    <span style="color: #999;" id="workspaceHint">未有任何元素</span>
                </div>
            </div>

            <!-- Hint Area -->
            <div class="hint-area" id="hintArea">
                <div class="hint-title">💡 提示</div>
                <div class="hint-content" id="hintContent"></div>
            </div>

            <!-- Buttons -->
            <div class="btn-row">
                <button class="btn btn-success" onclick="checkExpression()" style="font-size: 1.1em; padding: 15px 35px;">
                    ✅ 確認算式
                </button>
                <button class="btn btn-warning" onclick="showHint()">
                    💡 提示
                </button>
                <button class="btn btn-secondary" onclick="clearWorkspace()">
                    🗑️ 清空
                </button>
            </div>
        </div>
    </div>

    <!-- Result Overlay -->
    <div class="result-overlay" id="resultOverlay">
        <div class="result-box">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <div class="result-score" id="resultScore">100</div>
            <p style="color: #666; margin: 10px 0;" id="resultText">勁揪！</p>
            <button class="btn btn-primary" onclick="nextQuestion()">下一題 ➡️</button>
        </div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const CONFIG = {
            totalQuestions: 10,
            pointsPerCorrect: 100,
            streakBonus: 20,
            maxStreak: 5
        };

        // ==================== STATE ====================
        let state = {
            score: 0,
            streak: 0,
            currentQuestion: 0,
            currentProblem: null,
            workspace: [],
            availableElements: [],
            gameActive: false
        };

        // ==================== PROBLEM GENERATOR ====================
        function generateProblem() {
            const types = ['add_2num', 'add_3num', 'sub', 'mul', 'time_morning', 'shopping_dozencake', 'mixed_2step', 'big_add', 'red_packet', 'airconditioner', 'savings', 'yogurt_drink', 'farm_milk', 'fish_egg', 'walking_path', 'milk_weight', 'museum_visitors', 'town_population', 'pocket_money', 'supermarket_juice', 'bus_capacity', 'ticket_buy', 'book_return', 'fruit_discount', 'paper_flowers', 'milk_box', 'fruits_box', 'rubber_price', 'boat_people', 'cinema_seats'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            let problem = {};
            
            if (type === 'add_2num') {
                const a = getRandom(15, 80);
                const b = getRandom(10, 50);
                const result = a + b;
                problem = {
                    type: 'add',
                    question: `小明有 ${a} 粒糖果，媽媽再給了他 ${b} 粒，總共有多少粒？`,
                    correctExpression: `${a}+${b}`,
                    expectedResult: result,
                    hint: `有 ${a} 粒糖果，再加 ${b} 粒，即 ${a} + ${b}`,
                    elements: generateElements([a, b], null, '+'),
                    numbers: [a, b],
                    operator: '+'
                };
            } else if (type === 'add_3num') {
                const a = getRandom(20, 60);
                const b = getRandom(15, 40);
                const c = getRandom(10, 30);
                const result = a + b + c;
                problem = {
                    type: 'add_3num',
                    question: `圖書館有 ${a} 本書，第一天借出了 ${b} 本，第二天又借出了 ${c} 本，總共借出了多少本？`,
                    correctExpression: `${a}+${b}+${c}`,
                    expectedResult: result,
                    hint: `三個數相加：${a} + ${b} + ${c}`,
                    elements: generateElements([a, b, c], ['+', '+'], null),
                    numbers: [a, b, c],
                    operators: ['+', '+']
                };
            } else if (type === 'sub') {
                const a = getRandom(50, 150);
                const b = getRandom(20, 60);
                const result = a - b;
                problem = {
                    type: 'sub',
                    question: `有 ${a} 粒糖果，用了 ${b} 粒，剩餘多少粒？`,
                    correctExpression: `${a}-${b}`,
                    expectedResult: result,
                    hint: `由 ${a} 粒中扣減 ${b} 粒，即 ${a} - ${b}`,
                    elements: generateElements([a, b], null, '-'),
                    numbers: [a, b],
                    operator: '-'
                };
            } else if (type === 'mul') {
                const a = getRandom(3, 12);
                const b = getRandom(4, 9);
                const result = a * b;
                problem = {
                    type: 'mul',
                    question: `每盒有 ${a} 支鉛筆，有 ${b} 盒，總共有多少支？`,
                    correctExpression: `${a}×${b}`,
                    expectedResult: result,
                    hint: `${a} 支鉛筆 ${b} 盒，即 ${a} × ${b}`,
                    elements: generateElements([a, b], null, '×'),
                    numbers: [a, b],
                    operator: '×'
                };
            } else if (type === 'time_morning') {
                // 隨機選擇：下午比朝早少 OR 下午比朝早多
                const morning = getRandom(40, 99);
                const diff = getRandom(10, morning - 10);
                const isAfternoonLess = Math.random() > 0.5;
                
                let afternoon, question, expression;
                
                if (isAfternoonLess) {
                    // 下午比朝早少
                    afternoon = morning - diff;
                    question = `小明的麵包店早上賣出了 ${morning} 個麵包，下午賣出的數量比早上少了 ${diff} 個，全天共賣出多少個？`;
                    expression = `${morning}+${morning}-${diff}`;
                } else {
                    // 下午比朝早多
                    afternoon = morning + diff;
                    question = `小明的麵包店早上賣出了 ${morning} 個麵包，下午賣出的數量比早上多了 ${diff} 個，全天共賣出多少個？`;
                    expression = `${morning}+${morning}+${diff}`;
                }
                
                const result = morning + afternoon;
                const operators = isAfternoonLess ? ['+', '-'] : ['+', '+'];
                problem = {
                    type: 'time_add',
                    question: question,
                    correctExpression: expression,
                    expectedResult: result,
                    hint: `早上 ${morning} 個，下午 ${afternoon} 個`,
                    elements: generateElements([morning, morning, afternoon, diff], operators, null),
                    numbers: [morning, morning, afternoon, diff],
                    operators: operators
                };
            } else if (type === 'shopping_dozencake') {
                const cake = getRandom(5, 20);
                const dozen = 12;
                const result = cake * dozen;
                problem = {
                    type: 'shopping_mul',
                    question: `一個蛋糕售價為 ${cake} 元，購買一打（12個）需要多少元？`,
                    correctExpression: `${cake}×12`,
                    expectedResult: result,
                    hint: `一個 ${cake} 元，一打有 12 個，即 ${cake} × 12`,
                    elements: generateElements([cake, 12], null, '×'),
                    numbers: [cake, 12],
                    operator: '×'
                };
            } else if (type === 'big_add') {
                // 大數加法
                problem = {
                    type: 'big_add',
                    question: `玩具店有 1879 盒模型船和 2477 盒模型車，玩具店共有模型船和模型車多少盒？`,
                    correctExpression: `1879+2477`,
                    expectedResult: 1879 + 2477,
                    hint: `將模型船數量加埋模型車數量：1879 + 2477`,
                    elements: generateElements([1879, 2477], null, '+'),
                    numbers: [1879, 2477],
                    operator: '+'
                };
            } else if (type === 'red_packet') {
                // 利是錢 - 求相差
                const money1 = 1395;
                const money2 = 2860;
                problem = {
                    type: 'red_packet',
                    question: `永健有 ${money1} 元利是錢，彤彤有 ${money2} 元利是錢，兩人的利是錢相差多少元？`,
                    correctExpression: `${money2}-${money1}`,
                    expectedResult: money2 - money1,
                    hint: `用彤彤既錢扣減永健既錢：${money2} - ${money1}`,
                    elements: generateElements([money1, money2], null, '-'),
                    numbers: [money1, money2],
                    operator: '-'
                };
            } else if (type === 'airconditioner') {
                // 冷氣機 - 兩步減法
                const original = 3999;
                const discount1 = 1199;
                const discount2 = 499;
                problem = {
                    type: 'airconditioner',
                    question: `冷氣機原價 ${original} 元，現減價 ${discount1} 元，持會員卡可再減 ${discount2} 元。爸爸持會員卡買一台冷氣機，需付多少元？`,
                    correctExpression: `${original}-${discount1}-${discount2}`,
                    expectedResult: original - discount1 - discount2,
                    hint: `先減 ${discount1}，再減 ${discount2}：${original} - ${discount1} - ${discount2}`,
                    elements: generateElements([original, discount1, discount2], ['-', '-'], null),
                    numbers: [original, discount1, discount2],
                    operators: ['-', '-']
                };
            } else if (type === 'savings') {
                // 儲蓄問題 - 兩步加法
                const liheng = 1658;
                const jing = liheng + 2407;
                problem = {
                    type: 'savings',
                    question: `立行有 ${liheng} 元儲蓄，靜兒比立行多 ${2407} 元，立行和靜兒共有儲蓄多少元？`,
                    correctExpression: `${liheng}+${liheng}+${2407}`,
                    expectedResult: liheng + jing,
                    hint: `靜兒有 ${liheng} + ${2407} = ${jing} 元，再加立行既 ${liheng}`,
                    elements: generateElements([liheng, liheng, 2407], ['+', '+'], null),
                    numbers: [liheng, liheng, 2407],
                    operators: ['+', '+']
                };
            } else if (type === 'yogurt_drink') {
                // 乳酸菌飲品 - 乘法 (2打固定)
                const ml = getRandom(80, 200);
                const dozen = 2;
                const bottles = dozen * 12;
                const result = ml * bottles;
                problem = {
                    type: 'yogurt_drink',
                    question: `一瓶乳酸菌飲品的容量是 ${ml} 毫升。買 ${dozen} 打乳酸菌飲品，共有多少毫升？`,
                    correctExpression: `${ml}×${bottles}`,
                    expectedResult: result,
                    hint: `${dozen} 打 = ${bottles} 支，${ml}ml × ${bottles}`,
                    elements: generateElements([ml, bottles], null, '×'),
                    numbers: [ml, bottles],
                    operator: '×'
                };
            } else if (type === 'farm_milk') {
                // 農場牛奶 - 乘法
                const liters = getRandom(20, 50);
                const price = getRandom(15, 30);
                const result = liters * price;
                problem = {
                    type: 'farm_milk',
                    question: `一個農場每天產出 ${liters} 公升的牛奶，每公升牛奶的價格是 ${price} 元。農場一天的牛奶總收入是多少元？`,
                    correctExpression: `${liters}×${price}`,
                    expectedResult: result,
                    hint: `${liters} 公升 × ${price} 元 = ${result} 元`,

        function generateElements(numbers, operators, singleOp) {
            const elements = [];
            
            // 加入正確的數字
            numbers.forEach(n => {
                elements.push({ type: 'number', value: n, label: n.toString(), correct: true });
            });
            
            // 加入正確的運算符號
            if (singleOp) {
                elements.push({ type: 'operator', value: singleOp, label: singleOp, correct: true });
            } else if (operators) {
                operators.forEach(op => {
                    elements.push({ type: 'operator', value: op, label: op, correct: true });
                });
            }
            
            // 加入干擾項 - 更多數字
            const distractorNumbers = [];
            while (distractorNumbers.length < 3) {
                const d = getRandom(10, 99);
                if (!numbers.includes(d)) {
                    distractorNumbers.push(d);
                }
            }
            distractorNumbers.forEach(n => {
                elements.push({ type: 'distractor', value: n, label: n.toString(), correct: false });
            });
            
            // 加入干擾項 - 錯誤運算符號
            const allOps = ['+', '-', '×', '÷'];
            let correctOp = singleOp || (operators ? operators[0] : '+');
            const wrongOps = allOps.filter(o => o !== correctOp);
            wrongOps.slice(0, 2).forEach(op => {
                elements.push({ type: 'distractor', value: op, label: op, correct: false });
            });
            
            // 加入括號
            elements.push({ type: 'parenthesis', value: '(', label: '(', correct: false });
            elements.push({ type: 'parenthesis', value: ')', label: ')', correct: false });
            
            // 洗牌
            return elements.sort(() => Math.random() - 0.5);
        }

        function getRandom(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // ==================== GAME LOGIC ====================
        function startGame() {
            console.log('startGame called');
            state.score = 0;
            state.streak = 0;
            state.currentQuestion = 0;
            state.gameActive = true;
            
            console.log('Hiding startScreen, showing gameScreen');
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            
            console.log('Calling nextQuestion');
            nextQuestion();
        }

        function nextQuestion() {
            state.currentQuestion++;
            state.workspace = [];
            
            if (state.currentQuestion > CONFIG.totalQuestions) {
                showFinalResult();
                return;
            }
            
            // Generate new problem
            state.currentProblem = generateProblem();
            
            // Update UI
            document.getElementById('question').textContent = state.currentProblem.question;
            document.getElementById('score').textContent = state.score;
            document.getElementById('questionNum').textContent = `${state.currentQuestion}/${CONFIG.totalQuestions}`;
            document.getElementById('streak').textContent = state.streak;
            document.getElementById('progressFill').style.width = `${((state.currentQuestion-1)/CONFIG.totalQuestions)*100}%`;
            
            // Generate elements
            renderElements();
            renderWorkspace();
            
            // Hide hint
            document.getElementById('hintArea').classList.remove('show');
            
            // Hide result overlay
            document.getElementById('resultOverlay').classList.remove('show');
        }

        function renderElements() {
            const container = document.getElementById('elementsContainer');
            container.innerHTML = '';
            
            state.currentProblem.elements.forEach((el, index) => {
                const div = document.createElement('div');
                div.className = `drag-element ${el.type}`;
                div.draggable = true;
                div.dataset.value = el.value;
                div.dataset.label = el.label;
                div.dataset.index = index;
                div.textContent = el.label;
                
                div.ondragstart = dragStart;
                div.ontouchstart = touchStart;
                
                container.appendChild(div);
            });
        }

        function renderWorkspace() {
            const workspace = document.getElementById('workspace');
            
            if (state.workspace.length === 0) {
                workspace.innerHTML = '<span style="color: #999;" id="workspaceHint">未有任何元素</span>';
                return;
            }
            
            workspace.innerHTML = '';
            
            state.workspace.forEach((el, index) => {
                const div = document.createElement('div');
                div.className = 'workspace-element';
                div.draggable = true;
                div.dataset.workspaceIndex = index;
                div.innerHTML = `
                    <span>${el.label}</span>
                    <button class="remove-btn" onclick="removeFromWorkspace(${index})">×</button>
                `;
                
                div.ondragstart = workspaceDragStart;
                div.ontouchstart = touchStart;
                
                workspace.appendChild(div);
            });
        }

        // ==================== DRAG AND DROP + TOUCH SUPPORT ====================
        let draggedElement = null;
        let touchClone = null;

        function dragStart(e) {
            draggedElement = {
                value: e.target.dataset.value,
                label: e.target.dataset.label,
                index: parseInt(e.target.dataset.index),
                from: 'elements'
            };
            e.target.style.opacity = '0.5';
        }

        function workspaceDragStart(e) {
            const index = parseInt(e.target.dataset.workspaceIndex);
            draggedElement = {
                value: state.workspace[index].value,
                label: state.workspace[index].label,
                index: index,
                from: 'workspace'
            };
        }

        // ==================== TOUCH SUPPORT FOR MOBILE ====================
        let touchOffsetX = 0, touchOffsetY = 0;

        function touchStart(e) {
            // Check if touching remove button
            if (e.target.classList.contains('remove-btn')) {
                e.preventDefault();
                const index = parseInt(e.target.parentElement.dataset.workspaceIndex);
                removeFromWorkspace(index);
                return;
            }
            
            const touch = e.touches[0];
            const target = e.target.closest('.drag-element') || e.target.closest('.workspace-element');
            if (!target) return;
            
            e.preventDefault();
            
            const isWorkspace = target.closest('#workspace') !== null;
            const rect = target.getBoundingClientRect();
            
            draggedElement = {
                value: target.dataset.value,
                label: target.dataset.label,
                index: target.dataset.index !== undefined ? parseInt(target.dataset.index) : 
                       target.dataset.workspaceIndex !== undefined ? parseInt(target.dataset.workspaceIndex) : 0,
                from: isWorkspace ? 'workspace' : 'elements'
            };
            
            // Calculate offset so finger doesn't cover element
            touchOffsetX = touch.clientX - rect.left;
            touchOffsetY = touch.clientY - rect.top;
            
            // Hide original temporarily
            target.style.opacity = '0.3';
            
            // Create visual clone for dragging
            touchClone = target.cloneNode(true);
            touchClone.style.position = 'fixed';
            touchClone.style.zIndex = '9999';
            touchClone.style.pointerEvents = 'none';
            touchClone.style.opacity = '0.9';
            touchClone.style.transform = 'scale(1.15)';
            touchClone.style.boxShadow = '0 15px 40px rgba(0,0,0,0.4)';
            touchClone.style.transition = 'transform 0.1s';
            document.body.appendChild(touchClone);
            
            updateTouchClonePosition(touch);
            
            // Highlight workspace
            document.getElementById('workspace').classList.add('drag-over');
            
            // Add move and end listeners
            document.addEventListener('touchmove', touchMove, { passive: false });
            document.addEventListener('touchend', touchEnd);
            document.addEventListener('touchcancel', touchEnd);
        }

        function touchMove(e) {
            if (!touchClone) return;
            e.preventDefault();
            
            const touch = e.touches[0];
            updateTouchClonePosition(touch);
            
            // Check if over workspace
            const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            const workspace = elemBelow?.closest('#workspace');
            
            if (workspace) {
                document.getElementById('workspace').classList.add('drag-over');
            } else {
                document.getElementById('workspace').classList.remove('drag-over');
            }
        }

        function updateTouchClonePosition(touch) {
            if (!touchClone) return;
            // Position element above finger
            touchClone.style.left = (touch.clientX - touchOffsetX) + 'px';
            touchClone.style.top = (touch.clientY - touchOffsetY - 50) + 'px';
        }

        function touchEnd(e) {
            if (!touchClone) {
                cleanupTouch();
                return;
            }
            
            const touch = e.changedTouches[0];
            
            // Check what's under the finger
            const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            const workspace = elemBelow?.closest('#workspace');
            const elementTarget = elemBelow?.closest('.drag-element');
            
            // Quick tap: if tapped on element area but not dropping in workspace, add it
            if (elementTarget && !workspace) {
                handleTapAdd(elementTarget);
                cleanupTouch();
                return;
            }
            
            if (workspace) {
                // Drop in workspace
                handleDrop();
            }
            
            cleanupTouch();
        }

        // Tap to add (simpler for mobile)
        function handleTapAdd(target) {
            if (!draggedElement) return;
            
            const index = parseInt(target.dataset.index);
            const el = state.currentProblem.elements[index];
            
            if (el && !target.classList.contains('used')) {
                state.workspace.push({
                    value: el.value,
                    label: el.label
                });
                renderElements();
                renderWorkspace();
            }
        }

        function cleanupTouch() {
            if (touchClone) {
                touchClone.remove();
                touchClone = null;
            }
            draggedElement = null;
            
            document.getElementById('workspace').classList.remove('drag-over');
            
            // Remove listeners
            document.removeEventListener('touchmove', touchMove);
            document.removeEventListener('touchend', touchEnd);
            document.removeEventListener('touchcancel', touchEnd);
            
            // Refresh displays
            renderElements();
            renderWorkspace();
        }

        function handleDrop() {
            if (!draggedElement) return;
            
            if (draggedElement.from === 'elements') {
                state.workspace.push({
                    value: draggedElement.value,
                    label: draggedElement.label
                });
            } else if (draggedElement.from === 'workspace') {
                state.workspace.splice(draggedElement.index, 1);
                state.workspace.push({
                    value: draggedElement.value,
                    label: draggedElement.label
                });
            }
            
            renderWorkspace();
            renderElements();
            draggedElement = null;
        }

        function allowDrop(e) {
            e.preventDefault();
            document.getElementById('workspace').classList.add('drag-over');
        }

        function dragLeave(e) {
            document.getElementById('workspace').classList.remove('drag-over');
        }

        function drop(e) {
            e.preventDefault();
            document.getElementById('workspace').classList.remove('drag-over');
            
            if (!draggedElement) return;
            
            handleDrop();
        }

        function removeFromWorkspace(index) {
            const removed = state.workspace[index];
            
            // Remove from workspace
            state.workspace.splice(index, 1);
            
            // Unmark the original element
            const originalIndex = state.currentProblem.elements.findIndex(
                el => el.value == removed.value && el.label == removed.label && el.correct
            );
            
            if (originalIndex !== -1) {
                const elements = document.querySelectorAll('.drag-element');
                if (elements[originalIndex]) {
                    elements[originalIndex].classList.remove('used');
                    elements[originalIndex].draggable = true;
                }
            }
            
            renderWorkspace();
            renderElements();
        }

        function clearWorkspace() {
            state.workspace = [];
            renderWorkspace();
            renderElements();
        }

        // ==================== CHECK ANSWER ====================
        function checkExpression() {
            if (state.workspace.length === 0) {
                showHint();
                return;
            }
            
            // Build expression string
            const expression = state.workspace.map(el => el.value).join('');
            
            // Check if expression matches expected
            const expected = state.currentProblem.correctExpression;
            
            // Calculate result
            let userResult = null;
            try {
                // Convert × to * for eval
                const evalExpr = expression.replace(/×/g, '*').replace(/÷/g, '/');
                userResult = eval(evalExpr);
            } catch (e) {
                userResult = null;
            }
            
            const isCorrect = expression === expected || userResult === state.currentProblem.expectedResult;
            
            if (isCorrect) {
                // Correct!
                state.streak++;
                const bonus = Math.min(state.streak, CONFIG.maxStreak) * CONFIG.streakBonus;
                state.score += CONFIG.pointsPerCorrect + bonus;
                
                showResultOverlay(true);
            } else {
                // Wrong
                state.streak = 0;
                showResultOverlay(false);
            }
            
            updateUI();
        }

        function showResultOverlay(correct) {
            const overlay = document.getElementById('resultOverlay');
            const emoji = document.getElementById('resultEmoji');
            const score = document.getElementById('resultScore');
            const text = document.getElementById('resultText');
            
            if (correct) {
                emoji.textContent = '🎉';
                score.textContent = `+${CONFIG.pointsPerCorrect + Math.min(state.streak, CONFIG.maxStreak) * CONFIG.streakBonus}`;
                text.textContent = '答啱喇！勁揪！';
                text.style.color = '#4CAF50';
            } else {
                emoji.textContent = '😅';
                score.textContent = '再試過';
                text.textContent = `正確算式係：${state.currentProblem.correctExpression} = ${state.currentProblem.expectedResult}`;
                text.style.color = '#ff9800';
            }
            
            overlay.classList.add('show');
        }

        function updateUI() {
            document.getElementById('score').textContent = state.score;
            document.getElementById('streak').textContent = state.streak;
        }

        // ==================== HINT ====================
        function showHint() {
            const hintArea = document.getElementById('hintArea');
            const hintContent = document.getElementById('hintContent');
            
            // Provide progressive hint
            let hint = state.currentProblem.hint;
            
            // If workspace has some elements, give more specific hint
            if (state.workspace.length > 0) {
                const currentExpr = state.workspace.map(el => el.label).join(' ');
                hint = `你而家組成既算式係：「${currentExpr}」<br><br>${state.currentProblem.hint}`;
            }
            
            hintContent.innerHTML = hint;
            hintArea.classList.add('show');
        }

        // ==================== FINAL RESULT ====================
        function showFinalResult() {
            state.gameActive = false;
            
            const accuracy = state.score / (CONFIG.totalQuestions * CONFIG.pointsPerCorrect) * 100;
            
            let emoji = '';
            let text = '';
            
            if (accuracy >= 90) {
                emoji = '🏆';
                text = '超級數學天才！';
            } else if (accuracy >= 70) {
                emoji = '🌟';
                text = '好犀利！';
            } else if (accuracy >= 50) {
                emoji = '💪';
                text = '唔錯喎！';
            } else {
                emoji = '🔥';
                text = '再接再厲！';
            }
            
            const overlay = document.getElementById('resultOverlay');
            overlay.innerHTML = `
                <div class="result-box">
                    <div class="result-emoji">${emoji}</div>
                    <div class="result-score">${state.score}</div>
                    <p style="font-size: 1.5em; margin: 10px 0;">${text}</p>
                    <p style="color: #666;">完成曬 10 題喇！</p>
                    <button class="btn btn-primary" style="margin-top: 20px;" onclick="location.reload()">
                        🔄 再玩一次
                    </button>
                </div>
            `;
            overlay.classList.add('show');
        }

        // ==================== INIT ====================
        window.onload = () => {
            // Initialize any needed state
            document.getElementById('startBtn').addEventListener('click', startGame);
        };
    </script>
</body>
</html>
